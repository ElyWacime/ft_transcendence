<!DOCTYPE html>
<html>
<head>
    <title>Get User ID from JWT Token</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .info {
            background: #444;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Get User ID from JWT Token</h1>
        
        <div class="info">
            <p><strong>Instructions:</strong></p>
            <ol>
                <li>Make sure you're logged in to the application</li>
                <li>Click the button below to extract your User ID</li>
                <li>Use the ID to access: <code>http://localhost:8080/dashboard/YOUR_ID</code></li>
            </ol>
        </div>

        <button onclick="getUserId()">Get My User ID</button>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        function getUserId() {
            try {
                const token = localStorage.getItem("token");
                
                if (!token) {
                    document.getElementById("result").style.display = "block";
                    document.getElementById("result").innerHTML = 
                        "❌ No token found in localStorage.\n\n" +
                        "Please make sure you're logged in to the application.";
                    return;
                }

                // Decode JWT token
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                const decoded = JSON.parse(jsonPayload);

                const resultDiv = document.getElementById("result");
                resultDiv.style.display = "block";
                resultDiv.innerHTML = 
                    "✅ User ID Found!\n\n" +
                    "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n" +
                    "📋 User ID: " + (decoded.id || "Not found") + "\n\n" +
                    "📧 Email: " + (decoded.email || "Not found") + "\n\n" +
                    "👤 Name: " + (decoded.name || "Not found") + "\n\n" +
                    "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n" +
                    "🔗 Dashboard URL:\n" +
                    "http://localhost:8080/dashboard/" + (decoded.id || "YOUR_ID") + "\n\n" +
                    "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n" +
                    "📄 Full Token Data:\n" +
                    JSON.stringify(decoded, null, 2);
            } catch (error) {
                document.getElementById("result").style.display = "block";
                document.getElementById("result").innerHTML = 
                    "❌ Error decoding token:\n" + error.message;
            }
        }
    </script>
</body>
</html>
