map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  resolver 127.0.0.11 ipv6=off valid=30s;

  set $frontend_upstream http://frontend:8080;
  set $auth_upstream https://auth-service:8000;
  set $chat_upstream https://chat-service:3700;
  set $game_upstream https://game-server:3000;

  ssl_certificate     /etc/nginx/certs/dev.crt;
  ssl_certificate_key /etc/nginx/certs/dev.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  proxy_ssl_trusted_certificate /etc/nginx/certs/dev.crt;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 2;

  location / {
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/users/ {
    rewrite ^/api/users/(.*)$ /$1 break;
    proxy_pass $auth_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' $http_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

    if ($request_method = OPTIONS) {
        return 204;
    }
  }

  location /api/chat/ {
    rewrite ^/api/chat/(.*)$ /$1 break;
    proxy_pass $chat_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $chat_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/dashboard/ {
    rewrite ^/api/dashboard/(.*)$ /api/dashboard/$1 break;
    proxy_pass $game_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    add_header 'Access-Control-Allow-Origin' $http_origin;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

    if ($request_method = OPTIONS) {
        return 204;
    }
  }

  location = /check {
    proxy_pass $game_upstream/check;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /endmatch {
    proxy_pass $game_upstream/endmatch;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /allmatch {
    proxy_pass $game_upstream/allmatch;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /invite {
    proxy_pass $game_upstream/invite;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /tournament {
    proxy_pass $game_upstream/tournament;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /tournaments-online {
    proxy_pass $game_upstream/tournaments-online;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }
  location = /sync-email {
    proxy_pass $game_upstream/sync-email;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
  }

  location /ws {
    proxy_pass $game_upstream/ws;
    proxy_ssl_server_name on;
    proxy_ssl_name localhost;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
