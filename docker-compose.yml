services:
  # ---------- FRONTEND ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_GAME_SERVICE_URL=ws://game-service:3001
    networks:
      - transcendence

  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./services/.env
    ports:
      - "8000:8000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
      - ./services/auth-service/prisma/db:/app/prisma/db
    environment:
      - DATABASE_URL=file:/app/prisma/db/data.db
      - JWT_ACCESS_SECRET=supersecretkey
      - JWT_REFRESH_SECRET=superrefreshkey
      - PORT=8000
      - NODE_ENV=development
      - COOKIE_DOMAIN=localhost
    command: npm run dev
    networks:
      - transcendence
  # ----------  GAME  ----------
  game-service:
    build:
      context: ./services/game-service   
      dockerfile: Dockerfile
    container_name: game-service
    ports:
      - "3001:3001"
    depends_on:
      - frontend
      - auth-service
    networks:
      - transcendence
    environment:
      - PORT=3001
      - NODE_ENV=development

  # ---------- GATEWAY (NGINX) ----------
  gateway:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - auth-service
      - game-service
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - transcendence
   
networks:
  transcendence:
    driver: bridge
