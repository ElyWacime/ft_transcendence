services:
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./services/gateway/certs:/app/certs:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_HTTPS=true
    networks:
      - transcendence
    restart: always
  
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./services/.env
    # ports:
    #   - "8000:8000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
      - ./services/auth-service/prisma/db:/app/prisma/db
      - ./services/gateway/certs:/app/certs:ro
    environment:
      - PORT=8000
      - NODE_ENV=development
      - USE_HTTPS=true
    command: npm run dev
    networks:
      - transcendence
    restart: always
  
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    volumes:
      - ./services/chat-service:/app
      -  /app/node_modules
      - ./services/gateway/certs:/app/certs:ro
    env_file:
      - ./services/chat-service/.env
    environment:
      - USE_HTTPS=true
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_EXTRA_CA_CERTS=/app/certs/certificate.crt
    command: npm run start
    networks:
      - transcendence    
    restart: always  
  
  gateway:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - auth-service
      - game-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/gateway/certs:/etc/nginx/certs:ro
    networks:
      - transcendence
    restart: always
  
  game-server:
    build:
      context: ./services/game-service
      dockerfile: Dockerfile
    env_file:
      - ./services/game-service/.env
    environment:
      - USE_HTTPS=true
      - NODE_TLS_REJECT_UNAUTHORIZED=1
      - NODE_EXTRA_CA_CERTS=/app/certs/certificate.crt
    ports:
      - "3000:3000"
    command: npm run start
    volumes:
      - ./services/game-service/db:/app/db
      - ./services/gateway/certs:/app/certs:ro
    depends_on:
      - frontend
      - auth-service
    networks:
      - transcendence
    restart: always

networks:
  transcendence:
    driver: bridge
