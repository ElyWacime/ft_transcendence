services:
  # ---------- FRONTEND ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence

  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./services/.env
    ports:
      - "8000:8000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
      - ./services/auth-service/prisma/db:/app/prisma/db
    environment:
      - PORT=8000
      - NODE_ENV=development
    command: npm run dev
    networks:
      - transcendence

  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    ports:
      - "3700:3700"
    volumes:
      - ./services/chat-service:/app
      - /app/node_modules
    command: npm run start
    networks:
      - transcendence      

  # ---------- GATEWAY (NGINX) ----------
  gateway:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - auth-service
      - pong-server
      # - tournament-service
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - transcendence

  # ---------- FASTIFY TYPESCRIPT BACKEND ----------
  pong-server:
    build:
      context: ./services/fgame
      dockerfile: Dockerfile
    # container_name: pong-game
    environment:
      - JWT_ACCESS_SECRET=supersecretkey
      - JWT_REFRESH_SECRET=superrefreshkey
    ports:
      - "3000:3000"
    command: npm start
    depends_on:
      - frontend
      - auth-service
    networks:
      - transcendence
networks:
  transcendence:
    driver: bridge
