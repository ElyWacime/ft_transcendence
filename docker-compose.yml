services:
  # ---------- FRONTEND ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - transcendence

  # ---------- AUTH SERVICE ----------
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    env_file:
      - ./services/.env
    ports:
      - "8000:8000"
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
      - ./services/auth-service/prisma/db:/app/prisma/db
    environment:
      - PORT=8000
      - NODE_ENV=development
    command: npm run dev
    networks:
      - transcendence

  # ---------- TOURNAMENT SERVICE ----------
  # tournament-service:
  #   build:
  #     context: ./services/tournament-service
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8001:8001"
  #   volumes:
  #     - ./services/tournament-service:/app
  #     - /app/node_modules
  #   environment:
  #     - PORT=8001
  #     - NODE_ENV=development
  #   command: npm run dev
  #   networks:
  #     - transcendence
  #
  # ---------- GATEWAY (NGINX) ----------
  gateway:
    image: nginx:stable-alpine
    depends_on:
      - frontend
      - auth-service
      # - tournament-service
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - transcendence

  # ---------- FASTIFY TYPESCRIPT BACKEND ----------
  pong-server:
    build:
      context: ./services/fgame
      dockerfile: Dockerfile
    container_name: pong-game
    ports:
      - "3000:3000"
    command: npm start
    depends_on:
      - frontend
      - auth-service
      - gateway
    networks:
      - transcendence
  # pong-server:
  #   build:
  #     context: ./services/game
  #     dockerfile: Dockerfile
  #   container_name: game-pong
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - frontend
  #     - auth-service
  #     - gateway
  #   networks:
  #     - transcendence
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   command: npm start
networks:
  transcendence:
    driver: bridge
